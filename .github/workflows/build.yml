name: Build MyFileLab

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: MyFileLab-Windows
            ext: .exe
          - os: macos-latest
            name: MyFileLab-Mac
            ext: ""
          - os: ubuntu-latest
            name: MyFileLab-Linux
            ext: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 libglib2.0-0 \
            libxcb-xinerama0 libxcb-cursor0 \
            libegl1 libxkbcommon-x11-0 \
            libdbus-1-3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # ── Windows — single .exe ───────────────────────────────────────────────

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: >
          python -m PyInstaller
          --onefile --windowed
          --icon=icon_autopdf.ico
          --add-data "icon_autopdf.ico;."
          --add-data "LICENSE;."
          --add-data "TERMS_OF_USE.md;."
          --collect-all yt_dlp
          --collect-all certifi
          --collect-submodules features
          --name=MyFileLab-Windows
          main.py

      - name: Upload (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: MyFileLab-Windows
          path: dist/MyFileLab-Windows.exe

      # ── macOS — .app bundle zipped ──────────────────────────────────────────

      - name: Build (Mac)
        if: matrix.os == 'macos-latest'
        run: >
          python -m PyInstaller
          --windowed
          --icon=icon_autopdf.ico
          --add-data "icon_autopdf.ico:."
          --add-data "LICENSE:."
          --add-data "TERMS_OF_USE.md:."
          --collect-all yt_dlp
          --collect-all certifi
          --collect-submodules features
          --name=MyFileLab
          main.py

      - name: Zip .app (Mac)
        if: matrix.os == 'macos-latest'
        run: |
          cd dist
          zip -r MyFileLab-Mac.zip MyFileLab.app

      - name: Upload (Mac)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: MyFileLab-Mac
          path: dist/MyFileLab-Mac.zip

      # ── Linux — single binary, executable bit preserved ────────────────────

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: >
          python -m PyInstaller
          --onefile --windowed
          --icon=icon_autopdf.ico
          --add-data "icon_autopdf.ico:."
          --add-data "LICENSE:."
          --add-data "TERMS_OF_USE.md:."
          --collect-all yt_dlp
          --collect-all certifi
          --collect-submodules features
          --name=MyFileLab-Linux
          main.py

      - name: Set executable bit (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: chmod +x dist/MyFileLab-Linux

      - name: Upload (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: MyFileLab-Linux
          path: dist/MyFileLab-Linux

  # ── Release — attach all 3 artifacts ───────────────────────────────────────

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MyFileLab-Windows/MyFileLab-Windows.exe
            dist/MyFileLab-Mac/MyFileLab-Mac.zip
            dist/MyFileLab-Linux/MyFileLab-Linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
